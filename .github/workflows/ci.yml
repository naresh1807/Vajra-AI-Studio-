name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (ruff + pytest)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check core tests database
      - name: Test
        # conftest.py sets a deterministic VAJRA_PAIRING_TOKEN ("test-token");
        # the API test fixtures hard-code the same value, so don't override it here.
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rA --tb=short 2>&1 | tee pytest-core.txt
      - name: Publish pytest output for debugging
        if: always()
        shell: bash
        run: |
          git config user.email ci@vajra
          git config user.name vajra-ci
          git fetch origin
          git checkout --orphan ci-debug-core
          git reset
          mkdir -p _ci
          cp "$GITHUB_WORKSPACE/pytest-core.txt" _ci/pytest-core.txt || echo "no output file" > _ci/pytest-core.txt
          echo "run $GITHUB_RUN_ID / sha $GITHUB_SHA / $(date -u)" > _ci/meta.txt
          git add -f _ci
          git commit -m "ci-debug core $GITHUB_SHA" || echo nothing
          git push -f origin ci-debug-core

  extension:
    name: VS Code extension (tsc + build + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: vscode-extension
        run: |
          npm install
          npm run lint
          npm run build
          npx vsce package -o vajra-ai.vsix --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: vajra-ai-vsix
          path: vscode-extension/vajra-ai.vsix

  language-servers:
    name: extensions/language-servers install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install language-server packs
        working-directory: extensions/language-servers
        run: npm install
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: LSP tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rA --tb=short tests/test_lsp.py 2>&1 | tee pytest-lsp.txt
      - name: Publish LSP pytest output for debugging
        if: always()
        shell: bash
        run: |
          git config user.email ci@vajra
          git config user.name vajra-ci
          git fetch origin
          git checkout --orphan ci-debug-lsp
          git reset
          mkdir -p _ci
          cp "$GITHUB_WORKSPACE/pytest-lsp.txt" _ci/pytest-lsp.txt || echo "no output file" > _ci/pytest-lsp.txt
          git add -f _ci
          git commit -m "ci-debug lsp $GITHUB_SHA" || echo nothing
          git push -f origin ci-debug-lsp

  mobile:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    continue-on-error: true # SDK availability / template drift shouldn't block PRs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: mobile-android/flutter_app
        run: |
          flutter create --org ai.vajra --project-name vajra_companion --platforms android .
          flutter pub get
          flutter analyze
          flutter test

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (Vajra's own auditor)
        run: |
          pip install -e ".[dev]"
          python -c "from core.security.audit import secret_scan; r = secret_scan('.'); [print(f.severity, f.location, f.detail) for f in r.findings]; import sys; sys.exit(1 if not r.ok else 0)"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit || true
