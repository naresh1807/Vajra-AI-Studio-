[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vajra-ai"
version = "0.1.0"
description = "Vajra AI Studio - private local-first AI-native IDE and computer agent (Vajra Core)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Naresh Thatikonda" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "debugpy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
vajra-api = "core.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["core", "database"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"core/tools/computer_tools.py" = ["E501"]  # tool descriptions read better unwrapped
