[package]
name = "vajra-studio"
version = "0.2.0"
description = "Vajra AI Studio - private local-first AI-native IDE and computer agent"
authors = ["Naresh Thatikonda"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
